<!DOCTYPE html>
<html lang="zh-CN">

  {% include head.html %}

  <body>
    <div id="corner-image-container">
        <img src="{{ '/assets/images/akalin-48bb33b4.webp' | relative_url }}" alt="右上角装饰图">
    </div>
    {% include sidebar.html %}

    <div class="content container">
      {{ content }}
    </div>
    <!-- 全局灯箱（Lightbox）：全站唯一一份容器，文章内图片与相册共用，行为见 assets/lightbox.js -->
    <div id="global-lightbox" class="lightbox">
      <span class="close">&times;</span>
      <img class="lightbox-content" id="lightbox-img">
      <div class="caption" id="lightbox-caption"></div>
      <a class="prev">&#10094;</a>
      <a class="next">&#10095;</a>
   </div>
   {% if page.album %}<script src="{{ '/assets/album.js' | relative_url }}"></script>{% endif %}
   <script src="{{ '/assets/lightbox.js' | relative_url }}"></script>
  </body>
</html>
